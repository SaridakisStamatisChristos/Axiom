[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-research"
version = "0.5.0"
description = "Reproducible automated conjecture investigation over integer polynomials and typed elementary number theory, and finite simple graph mathematics"
requires-python = ">=3.11"
dependencies = ["sympy>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
axiom = "axiom.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
