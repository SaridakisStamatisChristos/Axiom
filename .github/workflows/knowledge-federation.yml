name: AXIOM v0.7 typed mathematical federation
on:
  push:
    branches: [main, "axiom-v0.7-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AXIOM
        run: python -m pip install -e '.[dev]'
      - name: Run adversarial multi-domain tests
        run: pytest -q tests/test_knowledge_federation.py
      - name: Rebuild original graph knowledge from unchanged v0.5 evidence
        run: |
          axiom knowledge-build \
            --db research/knowledge/ci_federated.sqlite3 \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
      - name: Replay algebra, number-theory, recurrence evidence from original campaigns
        run: |
          axiom knowledge-federate --db research/knowledge/ci_federated.sqlite3 \
            research/v03_campaign_report.json \
            research/number_theory/v04_report.json \
            research/number_theory/v04_sequences.json \
            > research/knowledge/ci_federation_summary.json
      - name: Fully audit existing graph and federated evidence
        run: |
          axiom knowledge-audit --db research/knowledge/ci_federated.sqlite3
          axiom knowledge-federation-audit --db research/knowledge/ci_federated.sqlite3
          axiom knowledge-cross-query --db research/knowledge/ci_federated.sqlite3 \
            --domain number_theory --limit 3
          axiom knowledge-cross-query --db research/knowledge/ci_federated.sqlite3 \
            --domain recurrence --limit 3
      - name: Preserve resulting auditable research database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v07-federation-python-${{ matrix.python-version }}
          path: |
            research/knowledge/ci_federated.sqlite3
            research/knowledge/ci_federation_summary.json
          if-no-files-found: warn
