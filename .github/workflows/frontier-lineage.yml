name: AXIOM v0.11 graph frontier lineage
on:
  push:
    branches: [main, "axiom-v0.11-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: axiom-v011-frontier-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-bound-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AXIOM test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Adversarial frontier materialization regressions
        run: pytest -q tests/test_frontier_lineage.py
      - name: Rebuild source-bound historical evidence
        run: |
          mkdir -p research/knowledge
          axiom knowledge-build --db research/knowledge/ci_v011.sqlite3 \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom knowledge-federate --db research/knowledge/ci_v011.sqlite3 \
            research/v03_campaign_report.json \
            research/number_theory/v04_report.json \
            research/number_theory/v04_sequences.json
          axiom knowledge-formal-import --db research/knowledge/ci_v011.sqlite3 \
            --algebra-ndjson research/v03_formal_results.ndjson \
            --number-index research/number_theory/v04_formal_results.ndjson \
            --number-records-dir research/lean_verified/number_theory
      - name: Execute and independently replay exact-order graph experiments
        run: |
          axiom graph-frontier-run --target-order 6 --seed 42 \
            --search-budget 256 --max-candidates 40 \
            --output research/knowledge/ci_n6.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom graph-frontier-run --target-order 7 --seed 42 \
            --search-budget 256 --max-candidates 40 \
            --output research/knowledge/ci_n7.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom graph-frontier-audit research/knowledge/ci_n6.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom graph-frontier-audit research/knowledge/ci_n7.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
      - name: Index, audit, and query all bounded experiments
        run: |
          axiom knowledge-frontier-import --db research/knowledge/ci_v011.sqlite3 \
            research/knowledge/ci_n6.json research/knowledge/ci_n7.json \
            > research/knowledge/ci_v011_summary.json
          axiom knowledge-frontier-audit --db research/knowledge/ci_v011.sqlite3
          axiom knowledge-frontier-query --db research/knowledge/ci_v011.sqlite3 \
            --order 6 --status REFUTED
          axiom knowledge-audit --db research/knowledge/ci_v011.sqlite3
          axiom knowledge-federation-audit --db research/knowledge/ci_v011.sqlite3
          axiom knowledge-formal-audit --db research/knowledge/ci_v011.sqlite3
      - name: Preserve complete scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v011-frontier-python-${{ matrix.python-version }}
          path: |
            research/knowledge/ci_v011.sqlite3
            research/knowledge/ci_v011_summary.json
            research/knowledge/ci_n6.json
            research/knowledge/ci_n7.json
          if-no-files-found: warn
