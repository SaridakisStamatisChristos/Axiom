name: AXIOM v0.8 source-bound Lean provenance
on:
  push:
    branches: [main, "axiom-v0.8-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: axiom-v08-provenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formal-provenance-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test against actual archived historical Lean records
        run: pytest -q tests/test_formal_provenance.py
      - name: Reconstruct audited v0.6 finite-graph knowledge
        run: |
          mkdir -p research/knowledge
          axiom knowledge-build \
            --db research/knowledge/ci_v08.sqlite3 \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
      - name: Independently replay all supported mathematical domains
        run: |
          axiom knowledge-federate --db research/knowledge/ci_v08.sqlite3 \
            research/v03_campaign_report.json \
            research/number_theory/v04_report.json \
            research/number_theory/v04_sequences.json
      - name: Source-bind original 85 algebra and 96 number-theory formal records
        run: |
          axiom knowledge-formal-import --db research/knowledge/ci_v08.sqlite3 \
            --algebra-ndjson research/v03_formal_results.ndjson \
            --number-index research/number_theory/v04_formal_results.ndjson \
            --number-records-dir research/lean_verified/number_theory \
            > research/knowledge/ci_v08_summary.json
      - name: Replay complete local and formal source linkage
        run: |
          axiom knowledge-audit --db research/knowledge/ci_v08.sqlite3
          axiom knowledge-federation-audit --db research/knowledge/ci_v08.sqlite3
          axiom knowledge-formal-audit --db research/knowledge/ci_v08.sqlite3
          axiom knowledge-formal-query --db research/knowledge/ci_v08.sqlite3 \
            --domain number_theory --limit 2
      - name: Install Lean toolchain manager
        if: matrix.python-version == '3.11'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Replay all historical sources in pinned Lean
        if: matrix.python-version == '3.11'
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          git diff --exit-code -- lake-manifest.json
          lake exe cache get Mathlib.Tactic.Ring Mathlib.Tactic.Linarith
          AXIOM_REAL_LEAN=1 pytest -q tests/test_lean_integration.py tests/test_number_theory_lean_integration.py
          AXIOM_REAL_LEAN=1 pytest -q tests/test_formal_provenance.py -k live_replay
          root=research/knowledge
          axiom knowledge-formal-replay --db "$root/ci_v08.sqlite3" > "$root/ci_v08_replay.json.tmp"
          python - "$root/ci_v08_replay.json.tmp" <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          import sys

          pending = Path(sys.argv[1])
          records = json.loads(pending.read_text())["records"]
          assert Counter(row["domain"] for row in records) == {"algebra": 85, "number_theory": 96}
          assert len({row["formal_record_id"] for row in records}) == 181
          pending.rename(pending.with_suffix(""))
          PY
          sha256sum "$root/ci_v08_replay.json" | tee "$root/ci_v08_replay.sha256"
      - name: Preserve auditable proof index and source-bound summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v08-source-bound-python-${{ matrix.python-version }}
          path: |
            research/knowledge/ci_v08.sqlite3
            research/knowledge/ci_v08_summary.json
            research/knowledge/ci_v08_replay.json
            research/knowledge/ci_v08_replay.sha256
          if-no-files-found: warn
