name: AXIOM v0.17 information-aware graph discovery
on:
  push:
    branches: [main, "axiom-v0.17-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-v017-discovery-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-sample-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source dependencies
        run: python -m pip install -e '.[dev]'
      - name: Adversarial sampler regression
        run: pytest -q tests/test_graph_nonduplicate.py tests/test_graph_adaptive.py
      - name: Reconstruct all independently audited source layers
        run: |
          mkdir -p research/knowledge/ci_v017
          DB=research/knowledge/ci_v017/science.sqlite3
          axiom knowledge-build --db "$DB" \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom knowledge-federate --db "$DB" \
            research/v03_campaign_report.json \
            research/number_theory/v04_report.json \
            research/number_theory/v04_sequences.json
          axiom knowledge-formal-import --db "$DB" \
            --algebra-ndjson research/v03_formal_results.ndjson \
            --number-index research/number_theory/v04_formal_results.ndjson \
            --number-records-dir research/lean_verified/number_theory
          axiom graph-frontier-run --target-order 6 --seed 42 \
            --search-budget 64 --max-candidates 10 \
            --output research/knowledge/ci_v017/frontier_n6.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom graph-frontier-run --target-order 7 --seed 42 \
            --search-budget 64 --max-candidates 10 \
            --output research/knowledge/ci_v017/frontier_n7.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom knowledge-frontier-import --db "$DB" \
            research/knowledge/ci_v017/frontier_n6.json \
            research/knowledge/ci_v017/frontier_n7.json
          axiom graph-n6-run --templates \
            handshake degree_bound triangle_upper_bound \
            forest_edge_count tree_edge_count connected_edge_lower_bound \
            bipartite_no_triangles edges_le_vertices connected_edges_ge_n \
            --output research/knowledge/ci_v017/exact_n6.json
          axiom knowledge-exact-n6-import --db "$DB" \
            research/knowledge/ci_v017/exact_n6.json
      - name: Execute source-aware candidate discovery and deterministic replay
        run: |
          DB=research/knowledge/ci_v017/science.sqlite3
          OUT=research/knowledge/ci_v017/discovery.json
          axiom graph-research-discover --db "$DB" --output "$OUT" \
            --seed 42 --source-probe 96 --experiment-budget 32 --task-limit 4
          axiom graph-research-discover-audit --db "$DB" "$OUT"
      - name: Scientifically audit new candidate prioritization and exclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from axiom.graph_adaptive import _historical
          path=Path("research/knowledge/ci_v017/discovery.json")
          db="research/knowledge/ci_v017/science.sqlite3"
          report=json.loads(path.read_text())
          old_masks,_,_,_=_historical(db)
          bank=report["candidate_bank"]
          assert bank["candidate_count"] >= 25
          assert bank["eligible_count"] > 0
          assert report["formal_kernel_executed"] is False
          assert report["theorem_promotion_count"] == 0
          assert report["source_evidence_modified"] is False
          assert len(report["new_graph_experiments"]) > 0
          assert all(x["statement"]["n"] == 7 for x in report["new_graph_experiments"])
          examined=set()
          for trial in report["new_graph_experiments"]:
              checked=set(trial["masks_checked"])
              assert not (checked & old_masks), "repeated original labelled graph"
              assert not (checked & examined), "repeated graph across generated candidates"
              examined.update(checked)
              assert trial["formal_lean_verification"] == "NOT_PERFORMED"
              assert trial["status"] in ("REFUTED","SURVIVED_BOUNDED_SEARCH")
              assert trial["generalization_to_all_n"] == "NOT_PROVED"
          assert bank["candidate_count"] > bank["eligible_count"]
          print({"candidates":bank["candidate_count"],
                 "eligible":bank["eligible_count"],
                 "historical_graphs":bank["historical_labelled_masks"],
                 "new_graphs":len(examined),
                 "new_refutations":report["new_refutations"]})
          PY
      - name: Preserve scientific evidence even if CI fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v017-source-replayed-novel-graphs
          path: research/knowledge/ci_v017/
          if-no-files-found: warn
