name: AXIOM Lean 4 verification
on:
  push:
    branches: [main, "axiom-v0.3-*", "axiom-v0.4-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-kernel:
    name: Lean 4 / Mathlib proof checking
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AXIOM
        run: python -m pip install -e '.[dev]'
      # Dedicated v0.11 workflow checks its heavyweight source-replay tests
      # under both supported Python versions; keep this regression focused
      # on the original mathematics before the real Lean kernel checks.
      - name: Run existing math regressions (v0.11 integration in dedicated CI)
        run: pytest -q --ignore=tests/test_frontier_lineage.py --ignore=tests/test_graph_n6_exact.py --ignore=tests/test_knowledge_exact_n6.py --ignore=tests/test_knowledge_graph_plan.py
      - name: Install elan toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Lean/Mathlib dependencies and download compiled cache
        run: |
          lake update
          lake exe cache get
      - name: Show exact versions and packages
        run: |
          lake env lean --version
          git -C .lake/packages/mathlib rev-parse HEAD
          cat lean-toolchain
          sha256sum lake-manifest.json
      - name: Check example identity in Lean kernel
        run: |
          axiom lean-verify research/certificates/example_identity.json \
            --project-root . \
            --output research/lean_verified/ci_identity.json \
            --source research/lean_verified/ci_identity.lean
      - name: Check SOS inequality in Lean kernel
        run: |
          axiom lean-verify research/certificates/example_sos.json \
            --project-root . \
            --output research/lean_verified/ci_sos.json \
            --source research/lean_verified/ci_sos.lean
      - name: Run genuine kernel-negative integration tests
        run: AXIOM_REAL_LEAN=1 pytest -q tests/test_lean_integration.py
      - name: Reproduce entire v0.2 mathematical research campaign
        run: |
          axiom run --seed 42 --candidates 300 --domain mixed \
            --lower -8 --upper 8 --max-evals 289 \
            --db research/ci_replay.sqlite3 \
            --report research/ci_replay_report.json
          axiom audit-report research/ci_replay_report.json
      - name: Check all 85 supported-fragment proofs in the actual Lean kernel
        run: |
          axiom lean-verify-report research/ci_replay_report.json \
            --project-root . \
            --output-dir research/lean_verified/campaign \
            --limit 85 --timeout 180
      - name: Audit all saved Lean records against original mathematical findings
        run: |
          axiom audit-lean-results research/ci_replay_report.json \
            research/lean_verified/campaign --require-complete
      - name: Reproduce integer number-theory campaign and independent audit
        run: |
          axiom nt-run --seed 42 --candidates 300 --lower -8 --upper 8 --max-evals 289 \
            --db research/nt_ci_replay.sqlite3 --report research/nt_ci_report.json
          axiom nt-audit research/nt_ci_report.json
      - name: Check and replay recurrence finite-state periodicity certificates
        run: |
          axiom nt-sequence-run --seed 42 --budget 40 --report research/nt_sequences_ci.json
          axiom nt-sequence-audit research/nt_sequences_ci.json
      - name: Run real number-theory Lean positive and negative integration tests
        run: AXIOM_REAL_LEAN=1 pytest -q tests/test_number_theory_lean_integration.py
      - name: Lean-check number-theory campaign proofs
        run: |
          axiom nt-lean-verify-report research/nt_ci_report.json \
            --project-root . --output-dir research/lean_verified/number_theory \
            --limit 96 --timeout 180
      - name: Independently audit number-theory Lean evidence against full research provenance
        run: |
          axiom nt-audit-lean-results research/nt_ci_report.json \
            research/lean_verified/number_theory --expected-attempts 96 --require-verified
      - name: Preserve verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v04-lean-and-number-theory-evidence
          path: research/lean_verified/
          if-no-files-found: warn
