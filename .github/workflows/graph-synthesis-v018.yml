name: AXIOM v0.18 compositional graph conjecture synthesis
on:
  push:
    branches: [main, "axiom-v0.18-*", "axiom-issue-15-*", "axiom-issue-18-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-v018-discovery-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  historical-sample-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source dependencies
        run: python -m pip install -e '.[dev]'
      - name: Adversarial sampler regression
        run: pytest -q tests/test_graph_nonduplicate.py tests/test_graph_adaptive.py tests/test_graph_synthesis.py
      - name: Reconstruct all independently audited source layers
        run: |
          mkdir -p research/knowledge/ci_v018
          DB=research/knowledge/ci_v018/science.sqlite3
          axiom knowledge-build --db "$DB" \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom knowledge-federate --db "$DB" \
            research/v03_campaign_report.json \
            research/number_theory/v04_report.json \
            research/number_theory/v04_sequences.json
          axiom knowledge-formal-import --db "$DB" \
            --algebra-ndjson research/v03_formal_results.ndjson \
            --number-index research/number_theory/v04_formal_results.ndjson \
            --number-records-dir research/lean_verified/number_theory
          axiom graph-frontier-run --target-order 6 --seed 42 \
            --search-budget 64 --max-candidates 10 \
            --output research/knowledge/ci_v018/frontier_n6.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom graph-frontier-run --target-order 7 --seed 42 \
            --search-budget 64 --max-candidates 10 \
            --output research/knowledge/ci_v018/frontier_n7.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom knowledge-frontier-import --db "$DB" \
            research/knowledge/ci_v018/frontier_n6.json \
            research/knowledge/ci_v018/frontier_n7.json
          axiom graph-n6-run --templates \
            handshake degree_bound triangle_upper_bound \
            forest_edge_count tree_edge_count connected_edge_lower_bound \
            bipartite_no_triangles edges_le_vertices connected_edges_ge_n \
            --output research/knowledge/ci_v018/exact_n6.json
          axiom knowledge-exact-n6-import --db "$DB" \
            research/knowledge/ci_v018/exact_n6.json
      - name: Synthesize universal graph conjectures and replay complete evidence
        run: |
          DB=research/knowledge/ci_v018/science.sqlite3
          OUT=research/knowledge/ci_v018/compositional.json
          axiom graph-synthesize --db "$DB" --output "$OUT" \
            --seed 42 --n6-training 64 --n7-training 64 \
            --holdout-budget 24 --max-candidates 4
          axiom graph-synthesize-audit --db "$DB" "$OUT"
      - name: Assert no source/holdout leakage and no false theorem promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from axiom.graph_adaptive import _historical
          from axiom.graph_affine import AffineGraphConjecture
          root=Path("research/knowledge/ci_v018")
          report=json.loads((root/"compositional.json").read_text())
          historical,_,_,_=_historical(str(root/"science.sqlite3"))
          assert report["synthesis"]["canonical_candidates_generated"] >= 0
          assert report["training"]["cohorts"]["5"]["graphs"] == 1024
          assert report["training"]["cohorts"]["5"]["scope"] == "ALL_LABELLED_GRAPHS_EXACT_N"
          assert report["training"]["n7_sample_is_from_audited_historical_sources"] is True
          assert report["historical_preflight"]["available_historical_graphs"] == len(historical)
          assert report["historical_preflight"]["new_graphs_used_for_selection"] == 0
          assert report["historical_preflight"]["formally_verified"] == 0
          for item in report["synthesis"]["selected"]:
              assert item["historical_preflight"]["status"] == "SURVIVED_AUDITED_HISTORICAL_MASKS"
              assert item["historical_preflight"]["not_a_proof"] is True
          assert report["holdout"]["selection_used_holdout_data"] is False
          assert report["holdout"]["inconclusive"] >= 0
          assert report["theorem_promotions"] == 0
          assert report["formal_lean_kernel_executed"] is False
          assert report["generalization_proved"] is False
          assert report["source_evidence_modified"] is False
          examined=set()
          for trial in report["holdout"]["experiments"]:
              AffineGraphConjecture.from_dict(trial["statement"])
              masks=set(trial["masks_checked"])
              assert not (masks & historical), "holdout leaked into old source evidence"
              assert not (masks & examined), "two candidates share checked masks"
              examined.update(masks)
              assert trial["theorem_status"] == "NOT_PROVED"
              if trial["assumption_satisfying_graphs"] == 0:
                  assert trial["status"] == "INCONCLUSIVE_NO_ANTECEDENT_COVERAGE"
              assert trial["lean_kernel_ran"] is False
          for handoff in report["lean_handoff"]:
              assert handoff["state"] == "PENDING_AFFINE_TO_LEAN_TRANSLATION"
              assert handoff["proof_available"] is False
              assert handoff["lean_formal_verification"] == "NOT_PERFORMED"
          assert report["holdout"]["distinct_graphs_checked"] == len(examined)
          print({"generated":report["synthesis"]["canonical_candidates_generated"],
                 "selected":len(report["synthesis"]["selected"]),
                 "heldout_graphs_checked":len(examined),
                 "refuted":report["holdout"]["refutations"],
                 "survived":report["holdout"]["survivals"],
                 "pending_lean":len(report["lean_handoff"])})
          PY
      - name: Synthesize equalities and inequalities and audit the cross-run holdout ledger
        run: |
          pytest -q tests/test_graph_discovery.py
          ROOT=research/knowledge/ci_v018
          V2="$ROOT/discovery_v2"
          mkdir -p "$V2"
          common=(--db "$ROOT/science.sqlite3" --legacy-v18 "$ROOT/compositional.json" --ledger "$V2/ledger.sqlite3")
          axiom graph-discover "${common[@]}" --campaign first --holdout-budget 16 > "$V2/first.json"
          axiom graph-discover "${common[@]}" --campaign second --holdout-budget 16 > "$V2/second.json"
          axiom graph-discover-audit "${common[@]}" --campaign second --artifact "$V2/second.json" > "$V2/replayed.json"
          axiom graph-discover-benchmark "${common[@]}" --campaign first > "$V2/benchmark.json"
          python - "$V2" <<'PY'
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          first, second = [json.loads((root / name).read_text())
                           for name in ("first.json", "second.json")]
          def checked(report):
              return {(trial["graph_order"], mask)
                      for trial in report["trials"] for mask in trial["masks_checked"]}
          assert first["discovery_counts"]["EQUALITY_PROPOSED"] > 0
          assert checked(first) and checked(second)
          assert checked(first).isdisjoint(checked(second))
          assert first["legacy_report_sha256"]["v18"]
          second["selection_used_holdout_data"] = True
          (root / "tampered.json").write_text(json.dumps(second))
          PY
          if axiom graph-discover-audit "${common[@]}" --campaign second --artifact "$V2/tampered.json" 2>"$V2/tamper-rejection.txt"; then
            echo "Replay accepted tampered evidence"
            exit 1
          fi
          grep -F "exported campaign differs from deterministic replay" "$V2/tamper-rejection.txt"
      - name: Install pinned Lean toolchain for the automatic proof handoff
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check claims selected by the discovery campaign
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          ROOT=research/knowledge/ci_v018
          V2="$ROOT/discovery_v2"
          axiom graph-discover-lean --db "$ROOT/science.sqlite3" \
            --legacy-v18 "$ROOT/compositional.json" --ledger "$V2/ledger.sqlite3" \
            --campaign first > "$V2/lean-handoff.json"
          python - "$V2" <<'PY'
          import json
          from pathlib import Path
          import sys
          from axiom.graph_claims import digest

          root = Path(sys.argv[1])
          discovery = json.loads((root / "first.json").read_text())
          handoff = json.loads((root / "lean-handoff.json").read_text())
          assert handoff["report_sha256"] == digest(discovery)
          assert {result["candidate_id"] for result in handoff["results"]} == {
              trial["candidate_id"] for trial in discovery["trials"]
              if trial["status"] == "EXPERIMENTALLY_SURVIVING"}
          assert any(record["lean_kernel_executed"] for result in handoff["results"]
                     for record in result["proof_records"])
          assert all(result["status"] in ("FORMALLY_VERIFIED_EXACT_N3", "REFUTED_BY_EXACT_ORDER_PRECHECK")
                     for result in handoff["results"])
          assert handoff["universal_theorems_promoted"] == 0
          PY
      - name: Prove a discovered relation over every graph order
        run: |
          pytest -q tests/test_graph_universal_lean.py
          lake exe cache get Mathlib.Combinatorics.SimpleGraph.Acyclic \
            Mathlib.Combinatorics.SimpleGraph.Bipartite \
            Mathlib.Combinatorics.SimpleGraph.Matching
          ROOT=research/knowledge/ci_v018
          V2="$ROOT/discovery_v2"
          common=(--db "$ROOT/science.sqlite3" --legacy-v18 "$ROOT/compositional.json" --ledger "$V2/ledger.sqlite3" --campaign first)
          axiom graph-discover-universal "${common[@]}" > "$V2/universal-lean.json"
          axiom graph-discover-universal-audit "${common[@]}" --artifact "$V2/universal-lean.json" > "$V2/universal-audit.json"
          python - "$V2/universal-lean.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          artifact = json.loads(Path(sys.argv[1]).read_text())
          verified = [item for item in artifact["results"] if item["handoff"] == "FORMALLY_VERIFIED"]
          assert verified, "no discovered survivor was checked at arbitrary graph order"
          for item in verified:
              proof = item["proof"]
              assert proof["lean_kernel_executed"] and proof["checker_exit_code"] == 0
              assert "(n : Nat) (G : SimpleGraph (Fin n))" in proof["source"]
              assert "PROVED" in item["claim_states"]
          assert any(item["handoff"] == "PENDING_UNSUPPORTED_RELATION" for item in artifact["results"])
          PY
      - name: Verify the compositional proof engine against the frozen benchmark
        run: |
          mkdir -p research/knowledge/ci_v018/proof_engine/benchmark
          OUT=research/knowledge/ci_v018/proof_engine
          pytest -q tests/test_graph_proof_search.py tests/test_graph_proof_pipeline.py | tee "$OUT/pytest.log"
          python scripts/benchmark_graph_proof.py --output "$OUT/benchmark" | tee "$OUT/benchmark.log"
          axiom graph-prove-audit "$OUT/benchmark/P6/attempt.json"
          pytest -q tests/test_graph_lemma_retrieval.py | tee "$OUT/retrieval-tests.log"
          python scripts/benchmark_graph_retrieval.py --output "$OUT/retrieval" | tee "$OUT/retrieval.log"
      - name: Replay the four-term discovery-to-proof campaign
        run: |
          ROOT=research/knowledge/ci_v018
          OUT="$ROOT/proof_engine"
          common=(--db "$ROOT/science.sqlite3" --legacy-v18 "$ROOT/compositional.json" --ledger "$OUT/discovery.sqlite3" --campaign proof-engine-v021)
          axiom graph-discover "${common[@]}" --proof-beam 8 --holdout-budget 8 --max-candidates 2 > "$OUT/discovery.json"
          axiom graph-discover-universal "${common[@]}" --compose > "$OUT/discovery_proof_report.json"
          axiom graph-discover-universal-audit "${common[@]}" --compose --artifact "$OUT/discovery_proof_report.json" > "$OUT/discovery_audited.json"
          cmp "$OUT/discovery_proof_report.json" "$OUT/discovery_audited.json"
          python - "$OUT" <<'PY'
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          report = json.loads((root / "discovery_proof_report.json").read_text())
          outcomes = []
          for index, attempt in enumerate(report["results"]):
              provenance = attempt["provenance"]
              assert provenance["selection_used_holdout_data"] is False
              if "queue" in provenance["trial"]:
                  outcomes.append(attempt["status"])
              if attempt["generated"] is not None:
                  (root / f"discovery-{index}.lean").write_text(attempt["generated"]["source"])
                  for stream in ("stdout", "stderr"):
                      log = attempt["kernel"][stream]
                      if log is not None:
                          (root / f"discovery-{index}.{stream}.log").write_text(log)
          assert set(outcomes) & {"FORMALLY_VERIFIED", "COUNTEREXAMPLE"}, outcomes
          print("Four-term lane outcomes:", outcomes)
          PY
      - name: Checksum retained proof evidence
        if: always()
        run: |
          OUT=research/knowledge/ci_v018/proof_engine
          if [[ -d "$OUT" ]]; then
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          fi
      - name: Preserve scientific evidence even if CI fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v018-source-replayed-novel-graphs
          path: research/knowledge/ci_v018/
          if-no-files-found: warn

  proof-engine-regressions:
    if: github.head_ref == 'axiom-v0.21-proof-engine' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]' pytest-xdist==3.8.0
      - run: pytest -q -n 4 --dist=loadfile | tee pytest-full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-full-python-regressions
          path: pytest-full.log
