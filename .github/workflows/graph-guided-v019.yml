name: AXIOM v0.19 assumption-aware graph research
on:
  push:
    branches: [main, "axiom-v0.19-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-v019-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-sample-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source dependencies
        run: python -m pip install -e '.[dev]'
      - name: Adversarial sampler regression
        run: pytest -q tests/test_graph_nonduplicate.py tests/test_graph_adaptive.py tests/test_graph_synthesis.py tests/test_graph_guided.py tests/test_graph_affine_lean.py
      - name: Reconstruct all independently audited source layers
        run: |
          mkdir -p research/knowledge/ci_v019
          DB=research/knowledge/ci_v019/science.sqlite3
          axiom knowledge-build --db "$DB" \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom knowledge-federate --db "$DB" \
            research/v03_campaign_report.json \
            research/number_theory/v04_report.json \
            research/number_theory/v04_sequences.json
          axiom knowledge-formal-import --db "$DB" \
            --algebra-ndjson research/v03_formal_results.ndjson \
            --number-index research/number_theory/v04_formal_results.ndjson \
            --number-records-dir research/lean_verified/number_theory
          axiom graph-frontier-run --target-order 6 --seed 42 \
            --search-budget 64 --max-candidates 10 \
            --output research/knowledge/ci_v019/frontier_n6.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom graph-frontier-run --target-order 7 --seed 42 \
            --search-budget 64 --max-candidates 10 \
            --output research/knowledge/ci_v019/frontier_n7.json \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json
          axiom knowledge-frontier-import --db "$DB" \
            research/knowledge/ci_v019/frontier_n6.json \
            research/knowledge/ci_v019/frontier_n7.json
          axiom graph-n6-run --templates \
            handshake degree_bound triangle_upper_bound \
            forest_edge_count tree_edge_count connected_edge_lower_bound \
            bipartite_no_triangles edges_le_vertices connected_edges_ge_n \
            --output research/knowledge/ci_v019/exact_n6.json
          axiom knowledge-exact-n6-import --db "$DB" \
            research/knowledge/ci_v019/exact_n6.json
      - name: Execute assumption-guided research on rebuilt audited source
        run: |
          DB=research/knowledge/ci_v019/science.sqlite3
          OUT=research/knowledge/ci_v019/guided.json
          axiom graph-synthesize-guided --db "$DB" --output "$OUT" \
            --seed 42 --n6-training 64 --n7-training 64 \
            --holdout-budget 24 --max-candidates 4
          axiom graph-synthesize-guided-audit --db "$DB" "$OUT"
      - name: Check antecedents, cross-candidate exclusion, and proof boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from axiom.graph_adaptive import _historical
          from axiom.graph_affine import AffineGraphConjecture, applicable
          from axiom.graph_checker import reference_properties
          root=Path("research/knowledge/ci_v019")
          report=json.loads((root/"guided.json").read_text())
          historical,_,_,_=_historical(str(root/"science.sqlite3"))
          assert report["historical_n7_count"] == len(historical)
          assert report["guided_holdout"]["selection_used_holdout_data"] is False
          assert report["formal_kernel_executed"] is False
          assert report["all_order_theorems_proved"] == 0
          assert report["historical_evidence_modified"] is False
          visited=set()
          for trial in report["guided_holdout"]["results"]:
              stmt=AffineGraphConjecture.from_dict(trial["statement"])
              masks=set(trial["masks_checked"])
              assert masks and not masks.intersection(historical)
              assert not masks.intersection(visited)
              visited.update(masks)
              assert trial["assumption_satisfying_graphs"] == trial["graphs_checked"]
              assert trial["sampling_not_uniform_random"] is True
              for mask in masks:
                  assert applicable(stmt.assumption, reference_properties(7, mask))
              assert trial["all_order_generalization"] == "NOT_PROVED"
          assert len(visited)==report["guided_holdout"]["distinct_new_graphs_checked"]
          assert report["guided_holdout"]["incomplete_budget"] == 0
          assert all(x["lean_formal_verification"]=="NOT_PERFORMED"
                     for x in report["lean_handoff"])
          print({"candidates":report["generated_canonical_candidates"],
                 "selected":len(report["selected"]),
                 "new_antecedent_graphs":len(visited),
                 "refutations":report["guided_holdout"]["refutations"],
                 "survivals":report["guided_holdout"]["nonvacuous_survivals"]})
          PY
      - name: Preserve scientific evidence even if CI fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v019-source-replayed-novel-graphs
          path: research/knowledge/ci_v019/
          if-no-files-found: warn
