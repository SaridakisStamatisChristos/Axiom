name: AXIOM finite graph mathematics
on:
  push:
    branches: [main, "axiom-v0.5-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-experiments:
    name: Python graph research and evidence replay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AXIOM
        run: python -m pip install -e '.[dev]'
      # New v0.11 integration tests run fully under frontier-lineage.yml
      # on Python 3.11 and 3.13, avoiding repeated full-source replay.
      - name: Run complete historical regression (v0.11 tested separately)
        run: pytest -q --ignore=tests/test_frontier_lineage.py
      - name: Replay finite graph baseline and independently audit every proof
        run: |
          axiom graph-run --seed 42 --candidates 240 --max-order 6 --search-budget 128 \
            --db research/graphs/ci_baseline.sqlite3 \
            --report research/graphs/ci_baseline.json
          axiom graph-audit research/graphs/ci_baseline.json
      - name: Replay scaling campaign and independent audit
        run: |
          axiom graph-run --seed 2026 --candidates 700 --max-order 7 --search-budget 160 \
            --db research/graphs/ci_scale.sqlite3 \
            --report research/graphs/ci_scale.json
          axiom graph-audit research/graphs/ci_scale.json
      - name: Check graph-isomorphism classes and finite combinatorial distributions
        run: |
          axiom graph-enumerate --max-order 5
          axiom graph-count --max-order 5
      - name: Preserve actual campaign reports on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v05-graph-research-python-${{ matrix.python-version }}
          path: |
            research/graphs/ci_baseline.json
            research/graphs/ci_scale.json
          if-no-files-found: warn
