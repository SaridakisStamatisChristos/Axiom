name: AXIOM v0.6 cumulative mathematical knowledge
on:
  push:
    branches: [main, "axiom-v0.6-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AXIOM
        run: python -m pip install -e '.[dev]'
      - name: Check knowledge graph adversarial regressions
        run: pytest -q tests/test_knowledge_graph.py
      - name: Import the PRESERVED baseline and scale reports
        run: |
          mkdir -p research/knowledge
          axiom knowledge-build \
            --db research/knowledge/ci_axiom.sqlite3 \
            research/graphs/v05_baseline_report.json \
            research/graphs/v05_scale_report.json \
            > research/knowledge/ci_summary.json
      - name: Independently replay all stored evidence and relationships
        run: |
          axiom knowledge-audit --db research/knowledge/ci_axiom.sqlite3
          axiom knowledge-query --db research/knowledge/ci_axiom.sqlite3 \
            --template handshake --order 5
      - name: Save verified graph and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v06-knowledge-${{ matrix.python-version }}
          path: |
            research/knowledge/ci_axiom.sqlite3
            research/knowledge/ci_summary.json
          if-no-files-found: warn
