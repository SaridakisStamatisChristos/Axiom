name: AXIOM v0.15 real graph Lean formalization
on:
  push:
    branches: [main, "axiom-v0.15-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: axiom-v015-graph-lean-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-graph-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and run graph Lean safety regressions
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_graph_lean.py
      - name: Install pinned elan and Lean
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve exact Lean / Mathlib lockfile and cache
        run: |
          lake update
          lake exe cache get
          lake env lean --version
          git -C .lake/packages/mathlib rev-parse HEAD
      - name: Create genuine independently checked n6 certificates
        run: |
          mkdir -p research/lean_verified/graph_n6
          axiom graph-n6-run --templates handshake degree_bound triangle_upper_bound \
            --output research/lean_verified/graph_n6/ci_exact_n6.json
          axiom graph-n6-audit research/lean_verified/graph_n6/ci_exact_n6.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/lean_verified/graph_n6')
          report = json.loads((p / 'ci_exact_n6.json').read_text())
          assert report['counts']['PROVED_IN_SUPPORTED_FRAGMENT'] == 3, report['counts']
          for finding in report['findings']:
              assert finding['status'] == 'PROVED_IN_SUPPORTED_FRAGMENT'
              name = finding['statement']['template']
              (p / f'{name}.json').write_text(json.dumps({
                  'statement': finding['statement'], 'certificate': finding['certificate']},
                  indent=2) + '\n')
          PY
      - name: Prove handshake lemma in actual Lean kernel
        run: |
          axiom graph-n6-lean-verify research/lean_verified/graph_n6/handshake.json \
            --project-root . --timeout 240 \
            --source research/lean_verified/graph_n6/handshake.lean \
            --output research/lean_verified/graph_n6/handshake_verified.json
      - name: Prove bounded vertex degree in actual Lean kernel
        run: |
          axiom graph-n6-lean-verify research/lean_verified/graph_n6/degree_bound.json \
            --project-root . --timeout 240 \
            --source research/lean_verified/graph_n6/degree_bound.lean \
            --output research/lean_verified/graph_n6/degree_bound_verified.json
      - name: Prove n6 triangle upper bound in actual Lean kernel
        run: |
          axiom graph-n6-lean-verify research/lean_verified/graph_n6/triangle_upper_bound.json \
            --project-root . --timeout 240 \
            --source research/lean_verified/graph_n6/triangle_upper_bound.lean \
            --output research/lean_verified/graph_n6/triangle_upper_bound_verified.json
      - name: Audit formal source records without expanding graph scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from axiom.graph_lean import audit_graph_lean_record
          root = Path('research/lean_verified/graph_n6')
          for template in ('handshake', 'degree_bound', 'triangle_upper_bound'):
              record=json.loads((root / f'{template}_verified.json').read_text())
              assert audit_graph_lean_record(record)
              assert record['status'] == 'FORMALLY_VERIFIED'
              assert record['accepted'] is True
              assert record['all_order_generalization'] == 'NOT_PROVED'
              assert record['scope'].endswith('exactly n=6 vertices')
          PY
      - name: Preserve actual checker evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v015-actual-lean-graph-evidence
          path: research/lean_verified/graph_n6/
          if-no-files-found: warn
